name: Build and publish

on:
  push:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_DIRECTORY: ${{ github.workspace }}/nuget

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Linux, os: ubuntu-24.04 }
        - { name: Windows, os: windows-2025-vs2026 }
        - { name: macOS, os: macos-26 }
        dotnet:
        - { name: .NET 8, version: '8.0.x' }
        - { name: .NET 10, version: '10.0.x' }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup ${{ matrix.dotnet.name }} SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet.version }}
      - name: Enforce SDK Version
        env:
          DOTNET_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version "$DOTNET_VERSION" --force
      - name: Verify SDK Installation
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Create NuGet package
        run: dotnet pack --no-build -c Release FauFau/FauFau.csproj --output "$NUGET_DIRECTORY"

      # Every push to master publishes, nbgv only counts the commits that touch the library, so a commit that only
      # changes tests or benchmarks keeps the version that already has a tag
      - name: Check for a new version
        if: matrix.platform.name == 'Linux' && matrix.dotnet.name == '.NET 8' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: version
        run: |
          dotnet tool install -g nbgv
          version=$(nbgv get-version -v NuGetPackageVersion)
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: NuGet Login
        if: steps.version.outputs.publish == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: TMW
      - name: Publish FauFau NuGet
        if: steps.version.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$NUGET_DIRECTORY"/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          nbgv tag
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" "v$(nbgv get-version -v NuGetPackageVersion)"
